<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%234B148C%27/%3E%3Crect x=%2716%27 y=%2716%27 width=%2732%27 height=%2732%27 rx=%274%27 fill=%27%23FEF363%27/%3E%3C/svg%3E">
<title>Fênix Fibra — Fala que te escuto</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --p: #4B148C;
  --pm: #6B2AAE;
  --o: #FF5513;
  --li: #D277FD;
  --y: #FEF363;
  --ic: #ECF6FF;
  --dk: #2F3947;
  --dk2: #1A1F28;
  --w: #FFFFFF;
  --gr: #22C55E;
  --rd: #EF4444;
}
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; }
body { font-family:"Inter",sans-serif; background:#1A1030; color:#fff; display:flex; flex-direction:column; }
.topbar { height:5px; background:var(--y); flex-shrink:0; }
.page { flex:1; min-height:0; display:flex; flex-direction:column; padding:20px clamp(16px,4vw,40px) 24px; }
/* Mural */
/* Header */
.s14-head { display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:14px; flex-shrink:0; }
.s14-left {}
.s14-label { font-size:10px; font-weight:800; letter-spacing:4px; color:var(--y); text-transform:uppercase; margin-bottom:4px; }
.s14-title { font-family:"Barlow Condensed",sans-serif; font-size:clamp(30px,4.5vw,52px); font-weight:900; color:#fff; text-transform:uppercase; line-height:.95; }
.s14-title span { color:var(--y); }
.s14-anon-badge { font-size:11px; color:rgba(255,255,255,.4); display:flex; align-items:center; gap:5px; }
/* Write area */
.s14-compose { display:flex; align-items:flex-end; gap:10px; margin-bottom:14px; flex-shrink:0; }
.s14-textarea { flex:1; background:#FEF363; border:none; border-radius:4px 4px 4px 0; padding:12px 14px; font-family:"Inter",sans-serif; font-size:13px; color:#2F3947; resize:none; outline:none; min-height:72px; box-shadow:3px 4px 0 rgba(0,0,0,.35); line-height:1.5; }
.s14-textarea::placeholder { color:rgba(47,57,71,.5); font-style:italic; }
.s14-color-row { display:flex; flex-direction:column; gap:6px; }
.s14-color-btn { width:22px; height:22px; border-radius:50%; border:2px solid rgba(255,255,255,.3); cursor:pointer; transition:.15s; flex-shrink:0; }
.s14-color-btn:hover, .s14-color-btn.active { border-color:#fff; transform:scale(1.2); }
.s14-post-btn { background:var(--o); border:none; border-radius:10px; padding:10px 20px; font-family:"Barlow Condensed",sans-serif; font-size:17px; font-weight:800; letter-spacing:1px; text-transform:uppercase; color:#fff; cursor:pointer; transition:.2s; white-space:nowrap; display:flex; align-items:center; gap:6px; flex-shrink:0; }
.s14-post-btn:hover { background:#e04a0f; transform:scale(1.03); }
/* Board */
.s14-board { flex:1; position:relative; min-height:0; overflow:hidden; border-radius:12px; background:rgba(255,255,255,.04); border:1px dashed rgba(255,255,255,.1); }
.s14-board-empty { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); color:rgba(255,255,255,.2); font-size:13px; text-align:center; pointer-events:none; }
/* Post-it notes */
.postit { position:absolute; min-width:130px; max-width:180px; padding:12px 14px 14px; border-radius:3px 3px 3px 0; font-family:"Inter",sans-serif; font-size:12px; line-height:1.55; color:#2F3947; word-wrap:break-word; cursor:grab; user-select:none; box-shadow:3px 5px 8px rgba(0,0,0,.4); transition:box-shadow .15s, transform .15s; z-index:1; }
.postit:active { cursor:grabbing; box-shadow:6px 10px 18px rgba(0,0,0,.5); z-index:99; }
.postit:hover { transform:rotate(0deg) scale(1.05) !important; z-index:50; }
.postit-pin { width:10px; height:10px; border-radius:50%; background:rgba(0,0,0,.2); position:absolute; top:-4px; left:50%; transform:translateX(-50%); }
.postit-time { display:block; font-size:9px; opacity:.5; margin-top:6px; font-style:italic; }
@media (max-width:640px) {
  .s14-head { flex-direction:column; align-items:flex-start; gap:6px; }
  .s14-compose { flex-wrap:wrap; }
  .s14-color-row { flex-direction:row; }
  .s14-post-btn { width:100%; justify-content:center; }
  .s14-board { min-height:320px; }
}
</style>
</head>
<body>
<div class="topbar"></div>
<div class="page">


    <!-- Header -->
    <div class="s14-head">
      <div class="s14-left">
        <div class="s14-label">Mural anônimo</div>
        <div class="s14-title">Fala que<br><span>te escuto.</span></div>
      </div>
      <div class="s14-anon-badge">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
        Anônimo · vai pro RH (rh@fenixfibra.com.br)
      </div>
    </div>
    <!-- Aviso de responsabilidade -->
    <div style="background:rgba(254,243,99,.08);border:1px solid rgba(254,243,99,.25);border-radius:10px;padding:8px 16px;display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-shrink:0">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--y)" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <span style="font-size:11px;color:rgba(255,255,255,.65);line-height:1.5">Use esse espaço com responsabilidade. <strong style="color:rgba(255,255,255,.9)">Críticas são bem-vindas quando ajudam a melhorar.</strong></span>
    </div>

    <!-- Compose -->
    <div class="s14-compose">
      <input type="checkbox" id="s14-botcheck" name="botcheck" tabindex="-1" autocomplete="off" style="display:none" aria-hidden="true">
<textarea id="s14-text" class="s14-textarea" rows="3" placeholder="O que você quer compartilhar? Sugestão, ideia, crítica construtiva… escreve aí 💛"></textarea>
      <div class="s14-color-row" id="s14-colors">
        <div class="s14-color-btn active" data-color="#FEF363" style="background:#FEF363" title="Amarelo"></div>
        <div class="s14-color-btn" data-color="#FFB3B3" style="background:#FFB3B3" title="Rosa"></div>
        <div class="s14-color-btn" data-color="#B3F0C8" style="background:#B3F0C8" title="Verde"></div>
        <div class="s14-color-btn" data-color="#B3D9FF" style="background:#B3D9FF" title="Azul"></div>
        <div class="s14-color-btn" data-color="#E8C6FF" style="background:#E8C6FF" title="Lilás"></div>
      </div>
      <button class="s14-post-btn" onclick="postarPostit()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Colar no mural
      </button>
    </div>

    <!-- Board -->
    <div class="s14-board" id="s14-board">
      <div class="s14-board-empty" id="s14-empty">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
        <br>O mural está vazio.<br>Seja o primeiro a colar um post-it! 📌
      </div>
    </div>

  
</div>

<script>
// ── MURAL DE POST-ITS ──
var selectedColor = '#FEF363';

// Init color picker
document.addEventListener('DOMContentLoaded', function() {
  initMural();
});
// Also try immediately (in case DOMContentLoaded already fired)
if (document.readyState !== 'loading') { initMural(); }

function initMural() {
  var btns = document.querySelectorAll('.s14-color-btn');
  btns.forEach(function(btn) {
    btn.addEventListener('click', function() {
      btns.forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      selectedColor = btn.getAttribute('data-color');
      var ta = document.getElementById('s14-text');
      if (ta) ta.style.background = selectedColor;
    });
  });
}

function escHtml(t) {
  return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}

function postarPostit() {
  var ta    = document.getElementById('s14-text');
  var board = document.getElementById('s14-board');
  var empty = document.getElementById('s14-empty');
  var btn   = document.querySelector('.s14-post-btn');

  if (!ta || !board) return;

// Anti-spam: robôs costumam marcar o campo escondido
var bot = document.getElementById('s14-botcheck');
if (bot && bot.checked) return;

  var txt = ta.value.trim();
  if (!txt) {
    ta.focus();
    ta.placeholder = 'Escreve algo antes de colar 😊';
    return;
  }

  // ── Cola o post-it imediatamente (não espera o envio) ──
  var bw  = board.offsetWidth  || 600;
  var bh  = board.offsetHeight || 300;
  var x   = 20 + Math.random() * Math.max(20, bw - 180);
  var y   = 10 + Math.random() * Math.max(10, bh - 120);
  var rot = (Math.random() - 0.5) * 8;
  var now = new Date();
  var time = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');

  var note = document.createElement('div');
  note.className = 'postit';
  note.style.cssText = 'background:'+selectedColor+';left:'+x+'px;top:'+y+'px;transform:rotate('+rot+'deg);';
  note.innerHTML = '<div class="postit-pin"></div>' + escHtml(txt) + '<span class="postit-time">agora às ' + time + '</span>';
  makeDraggable(note, board);
  board.appendChild(note);
  if (empty) empty.style.display = 'none';

  // Reset textarea
  var savedTxt = txt;
  ta.value = '';
  ta.style.background = selectedColor;
  ta.placeholder = 'O que você quer compartilhar? Sugestão, ideia, crítica construtiva… escreve aí 💛';

  // ── Envia via Web3Forms (completamente anônimo) ──
  if (btn) { btn.disabled = true; btn.textContent = 'Enviando…'; }

  fetch('https://api.web3forms.com/submit', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
    body: JSON.stringify({
      access_key: '57edc38b-e2ff-4e3c-b23b-85ffe105ce5f',
      subject: '[Mural Fênix] Post-it anônimo — ' + now.toLocaleString('pt-BR'),
      message: savedTxt,
      from_name: 'Mural Anônimo — Fênix Fibra',
      replyto: 'noreply@fenixfibra.com.br',
botcheck: false
    })
  })
  .then(function(r){ return r.json(); })
  .then(function(data){
    if (btn) {
      if (data.success) {
        btn.textContent = '✓ Colado!';
        setTimeout(function(){ btn.disabled=false; btn.innerHTML='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Colar no mural'; }, 2000);
      } else {
        btn.textContent = 'Colado (sem envio)';
        setTimeout(function(){ btn.disabled=false; btn.innerHTML='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Colar no mural'; }, 2000);
      }
    }
  })
  .catch(function(){
    if (btn) {
      btn.textContent = 'Colado (sem envio)';
      setTimeout(function(){ btn.disabled=false; btn.innerHTML='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Colar no mural'; }, 2000);
    }
  });
}

function makeDraggable(el, container) {
  var startX, startY, startL, startT, dragging = false;

  el.addEventListener('mousedown', function(e) {
    if (e.button !== 0) return;
    dragging = true;
    startX = e.clientX; startY = e.clientY;
    startL = parseInt(el.style.left) || 0;
    startT = parseInt(el.style.top)  || 0;
    el.style.zIndex = 99;
    el.style.transition = 'none';
    e.preventDefault();
  });

  document.addEventListener('mousemove', function(e) {
    if (!dragging) return;
    var bw = container.offsetWidth;
    var bh = container.offsetHeight;
    var nl = Math.max(0, Math.min(bw - el.offsetWidth,  startL + (e.clientX - startX)));
    var nt = Math.max(0, Math.min(bh - el.offsetHeight, startT + (e.clientY - startY)));
    el.style.left = nl + 'px';
    el.style.top  = nt + 'px';
  });

  document.addEventListener('mouseup', function() {
    if (dragging) {
      dragging = false;
      el.style.zIndex = 1;
      el.style.transition = '';
    }
  });

  // Touch support
  el.addEventListener('touchstart', function(e) {
    var t = e.touches[0];
    startX = t.clientX; startY = t.clientY;
    startL = parseInt(el.style.left) || 0;
    startT = parseInt(el.style.top)  || 0;
    el.style.zIndex = 99;
  }, { passive: true });

  el.addEventListener('touchmove', function(e) {
    var t  = e.touches[0];
    var bw = container.offsetWidth;
    var bh = container.offsetHeight;
    el.style.left = Math.max(0, Math.min(bw - el.offsetWidth,  startL + (t.clientX - startX))) + 'px';
    el.style.top  = Math.max(0, Math.min(bh - el.offsetHeight, startT + (t.clientY - startY))) + 'px';
    e.preventDefault();
  }, { passive: false });

  el.addEventListener('touchend', function() { el.style.zIndex = 1; });
}
// ── END MURAL ──
</script>
</body>
</html>
